name: Bash Script CI

on:
  push:
    branches: [main]
    paths:
      - '**.sh'

jobs:
  ci-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ShellCheck all .sh files
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck
